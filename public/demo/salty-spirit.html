<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Salty Spirit × Castwise — Demo</title>
<style>
  :root{--navy:#0b3a6e;--blue:#0e5fa8;--sun:#f4a20f;--sea:#e8f2fb;--ink:#14233a;--muted:#5b6b80;--line:#d9e3ee;--good:#1f8a4c;}
  *{box-sizing:border-box}
  body{margin:0;background:#eef3f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",sans-serif;color:var(--ink)}
  .wrap{display:flex;flex-direction:column;align-items:center;padding:18px 12px 40px;gap:12px}
  .top{max-width:420px;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .badge{font-size:12px;background:#fff3d6;color:#7a5200;border:1px solid #f1d28a;border-radius:99px;padding:4px 10px;font-weight:700}
  .lang button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer;color:var(--muted)}
  .lang button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .phone{width:100%;max-width:400px;height:780px;background:#fff;border-radius:34px;border:10px solid #10151d;box-shadow:0 20px 50px rgba(10,30,60,.25);overflow:hidden;display:flex;flex-direction:column;position:relative}
  .screen{flex:1;overflow-y:auto;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}
  .appbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .appbar b{color:#0d7377}
  .tabs{display:flex;border-top:1px solid var(--line);background:#fff}
  .tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:11px;color:var(--muted);cursor:pointer;font-weight:700}
  .tabs button .i{font-size:20px;display:block}
  .tabs button.on{color:var(--blue)}
  .hero{background:linear-gradient(160deg,var(--navy),var(--blue));color:#fff;padding:18px 16px 16px}
  .hero .logo{background:#fff;border-radius:14px;padding:8px 12px;display:inline-block}
  .hero .logo img{height:58px;display:block}
  .partner{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,255,255,.15);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
  .hero p{margin:8px 0 0;font-size:13px;opacity:.9;line-height:1.5}
  .sec{padding:14px 16px}
  h3{margin:0 0 8px;font-size:15px}
  .card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .muted{color:var(--muted);font-size:12px}
  .price{font-weight:800;color:var(--navy)}
  .btn{display:inline-block;border:0;border-radius:10px;background:var(--sun);color:#1b1300;font-weight:800;padding:8px 12px;font-size:13px;text-decoration:none;cursor:pointer}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.full{display:block;width:100%;text-align:center;padding:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;background:var(--sea);color:var(--navy);border-radius:99px;padding:4px 9px;font-weight:600}
  .cond{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cond div{background:var(--sea);border-radius:12px;padding:10px 6px;text-align:center}
  .cond b{display:block;font-size:17px;color:var(--navy)}
  .cond span{font-size:11px;color:var(--muted)}
  .sample{font-size:10.5px;color:#9a7a2a;margin-top:6px}
  .score{display:flex;align-items:center;gap:10px;background:#eaf7ef;border:1px solid #bfe3cc;border-radius:12px;padding:10px;margin-top:8px}
  .score .n{font-size:26px;font-weight:900;color:var(--good)}
  .t-hero{background:linear-gradient(160deg,#071f3d,var(--navy));color:#fff;padding:16px}
  .live{display:inline-block;background:#e63946;color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px}
  .t-hero h2{margin:8px 0 4px;font-size:20px}
  .seg{display:flex;background:var(--sea);border-radius:10px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .lb{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .lb .rk{width:28px;text-align:center;font-weight:900;font-size:16px}
  .lb .who{flex:1}
  .lb .w{font-weight:900;color:var(--navy)}
  .ok{font-size:11px;color:var(--good);font-weight:700}
  .prize{display:flex;gap:10px;align-items:center;padding:8px 0}
  .prize .e{font-size:22px}
  .cc{margin:4px auto 12px;width:300px;border-radius:18px;padding:10px;background:linear-gradient(145deg,#f7c548,#f4a20f 40%,#e07b00);box-shadow:0 10px 24px rgba(160,90,0,.35)}
  .cc-in{background:#fffdf5;border-radius:12px;overflow:hidden}
  .cc-top{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--navy);color:#fff}
  .cc-top b{font-size:16px}
  .cc-top span{font-size:12px;font-weight:800;color:var(--sun)}
  .cc-art{height:150px;background:linear-gradient(180deg,#bfe3ff,#3b8fd6);display:flex;align-items:center;justify-content:center;position:relative}
  .cc-art img{position:absolute;right:8px;top:8px;width:36px;height:36px}
  .cc-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px}
  .cc-stats div{background:var(--sea);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--muted)}
  .cc-stats b{display:block;font-size:14px;color:var(--ink)}
  .cc-foot{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px;font-size:11px;color:var(--muted)}
  .rare{font-weight:800;color:#b5179e}
  .verified{display:inline-flex;align-items:center;gap:4px;color:var(--good);font-weight:800}
  .modal{position:absolute;inset:0;background:rgba(5,15,30,.55);display:none;align-items:flex-end;z-index:5}
  .modal.on{display:flex}
  .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px}
  .steps{display:flex;gap:6px;margin:10px 0}
  .steps div{flex:1;height:5px;border-radius:9px;background:var(--line)}
  .steps div.on{background:var(--blue)}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px}
  .qr{display:grid;grid-template-columns:repeat(21,1fr);width:150px;height:150px;margin:8px auto;border:6px solid #fff;outline:1px solid var(--line)}
  .qr i{display:block}
  .note{max-width:420px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
  .toast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#10151d;color:#fff;border-radius:99px;padding:8px 14px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="badge" data-t="demoBadge"></span>
    <div class="lang"><button id="bES" class="on">ES</button> <button id="bEN">EN</button></div>
  </div>

  <div class="phone">
    <div class="appbar"><b>Castwise</b> · <span data-t="appbar"></span></div>
    <div class="screen" id="screen"></div>
    <div class="tabs">
      <button data-tab="partner" class="on"><span class="i">⚓</span><span data-t="tabPartner"></span></button>
      <button data-tab="tourney"><span class="i">🏆</span><span data-t="tabTourney"></span></button>
      <button data-tab="card"><span class="i">🃏</span><span data-t="tabCard"></span></button>
      <button data-tab="qr"><span class="i">📱</span><span data-t="tabQR"></span></button>
    </div>
    <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="note" data-t="footnote"></div>
</div>

const TRIPS = [
  { es: "Charter de pesca offshore", en: "Offshore Fishing Charter", p: 1100, h: "4", url: "/products/offshore-fishing-charter", e: "🎣" },
  { es: "Charter de pesca inshore", en: "Inshore Fishing Charter", p: 800, h: "4", url: "/products/inshore-fishing-charter", e: "🐟" },
  { es: "Charter privado La Muñeca", en: "La Muñeca Private Charter", p: 1200, h: "4–8", url: "/products/la-muneca-boat-charter", e: "⛵" },
  { es: "Atardecer y Bio Bay privado", en: "Sunset & Bio Bay Private", p: 350, h: "3", url: "/products/vip-sunset-bio-bay-boat-charter", e: "🌅" },
  { es: "Kayak transparente Bio Bay", en: "Bio Bay Clear Kayak", p: 75, h: "2", url: "/products/bioluminescent-bay-full-clear-kayaking", e: "✨" },

const SPECIES = { es: ["Dorado (mahi-mahi)", "Peto (wahoo)", "Atún", "Sierra", "Barracuda", "Sábalo (tarpon)", "Róbalo (snook)", "Pargo", "Palometa (permit)", "Macabí (bonefish)"],
                  en: ["Mahi-mahi", "Wahoo", "Tuna", "King mackerel", "Barracuda", "Tarpon", "Snook", "Snapper", "Permit", "Bonefish"] };
const BOARD = {
  offshore: [["🇺🇸 Sample Angler A", "Mahi-mahi", "14.2 lb"], ["🇵🇷 Sample Angler B", "Wahoo", "12.8 lb"], ["🇺🇸 Sample Angler C", "King mackerel", "9.6 lb"], ["🇨🇦 Sample Angler D", "Blackfin tuna", "7.1 lb"]],
  inshore: [["🇵🇷 Sample Angler E", "Tarpon (release)", "42 in"], ["🇺🇸 Sample Angler F", "Snook", "29 in"], ["🇺🇸 Sample Angler G", "Mutton snapper", "6.4 lb"]],
};

let lang = "es", tab = "partner", cat = "offshore", step = 0;
const T = k => S[lang][k];
const $ = id => document.getElementById(id);

function partner() {
  return `<div class="hero">
    <div class="logo"><img src="${LOGO}" alt="Salty Spirit"></div><br>
    <span class="partner">⚓ ${T("partner")}</span>
    <p>${T("heroP")}</p></div>
  <div class="sec">
    <h3>${T("today")}</h3>
    <div class="cond"><div><b>27.9°C</b><span>${T("sea")}</span></div><div><b>11 kt E</b><span>${T("wind")}</span></div><div><b>↑ 06:42</b><span>${T("tide")}</span></div></div>
    <div class="score"><div class="n">84</div><div><b>${T("bite")}</b><div class="muted">${T("biteNote")}</div></div></div>
    <div class="sample">${T("sampleData")}</div>
  </div>
  <div class="sec"><h3>${T("trips")}</h3>
    ${TRIPS.map(t => `<div class="card row"><div><div style="font-weight:700">${t.e} ${t[lang]}</div><div class="muted">${t.h} ${T("hrs")} · ${T("upTo")}</div></div>
      <div style="text-align:right"><div class="price">$${t.p.toLocaleString()}</div><a class="btn" href="${SITE}${t.url}" target="_blank" rel="noopener">${T("book")}</a></div></div>`).join("")}
  </div>
  <div class="sec"><h3>${T("boat")}</h3><div class="card muted" style="color:var(--ink)">🚤 ${T("boatLine")}</div>
    <h3 style="margin-top:12px">${T("species")}</h3><div class="chips">${SPECIES[lang].map(s => `<span class="chip">${s}</span>`).join("")}</div></div>`;
}

function tourney() {
  const rows = BOARD[cat];
  return `<div class="t-hero"><img src="${MARK}" style="width:34px;height:34px;float:right" alt="">
      <span class="live">${T("live")}</span><h2>${T("tHead")}</h2><div style="font-size:13px;opacity:.85">${T("tSub")}</div></div>
    <div class="sec">
      <div class="seg"><button data-cat="offshore" class="${cat === "offshore" ? "on" : ""}">${T("offshore")}</button><button data-cat="inshore" class="${cat === "inshore" ? "on" : ""}">${T("inshore")}</button></div>
      <div class="muted" style="margin-bottom:4px">${T("sampleEntries")}</div>
      ${rows.map((r, i) => `<div class="lb"><div class="rk">${["🥇", "🥈", "🥉"][i] || "#" + (i + 1)}</div><div class="who"><b>${r[0]}</b><div class="muted">${r[1]}</div><div class="ok">${T("verified")}</div></div><div class="w">${r[2]}</div></div>`).join("")}
      <button class="btn blue full" id="enter" style="margin-top:14px">${T("enter")}</button>
    </div>
    <div class="sec"><h3>${T("prizes")}</h3>
      <div class="prize"><span class="e">🛶</span><div><b>${T("p1")}</b><div class="muted">${T("p1d")}</div></div></div>
      <div class="prize"><span class="e">🧢</span><div><b>${T("p2")}</b><div class="muted">${T("p2d")}</div></div></div>
      <div class="prize"><span class="e">🎟️</span><div><b>${T("p3")}</b><div class="muted">${T("p3d")}</div></div></div></div>
    <div class="sec"><h3>${T("howTitle")}</h3>
      <ol style="margin:0;padding-left:20px;font-size:13px;line-height:1.8">${["how1", "how2", "how3", "how4"].map(k => `<li>${T(k)}</li>`).join("")}</ol></div>`;
}

const FISH = `<svg viewBox="0 0 260 120" width="230" height="110" aria-hidden="true">
  <path d="M30 62 C60 20 150 18 200 50 L240 22 L232 62 L240 100 L200 74 C150 106 60 104 30 62Z" fill="#2fa86b"/>
  <path d="M30 62 C60 40 150 38 200 56 L200 70 C150 88 60 86 30 62Z" fill="#f2d33a"/>
  <path d="M70 30 C100 10 150 12 170 28 L120 36Z" fill="#1f7f8f"/>
  <circle cx="50" cy="56" r="5" fill="#10151d"/><circle cx="51" cy="55" r="1.6" fill="#fff"/>
  <g fill="#1f7f8f" opacity=".55"><circle cx="95" cy="52" r="3"/><circle cx="120" cy="47" r="3"/><circle cx="145" cy="50" r="3"/><circle cx="110" cy="66" r="2.5"/><circle cx="135" cy="64" r="2.5"/></g>
</svg>`;

function card() {
  return `<div class="sec"><h3>${T("cardTitle")}</h3><div class="muted" style="margin-bottom:10px">${T("cardSub")}</div></div>
    <div class="cc"><div class="cc-in">
      <div class="cc-top"><b>${lang === "es" ? "Dorado" : "Mahi-mahi"}</b><span>${T("rare")}</span></div>
      <div class="cc-art"><img src="${MARK}" alt="">${FISH}</div>
      <div class="cc-stats">
        <div>${T("weight")}<b>14.2 lb</b></div><div>${T("length")}<b>38 in</b></div>
        <div>${T("date")}<b>${lang === "es" ? "12 ene 2027" : "Jan 12, 2027"}</b></div><div>${T("spot")}<b>Vieques offshore</b></div>
        <div>${T("boatL")}<b>La Muñeca</b></div><div>Angler<b>Sample Angler A</b></div>
      </div>
      <div class="cc-foot"><span class="verified">✓ ${lang === "es" ? "Capitán" : "Captain"}</span><span>#001 · Salty Spirit × Castwise</span></div>
    </div></div>
    <div class="sec"><button class="btn full" id="share">${T("share")}</button></div>`;
}

function qrGrid() {
  // Decorative QR-style pattern (not a scannable code).
  let s = 1234567, cells = "";
  const finder = (r, c) => { for (const [fr, fc] of [[0, 0], [0, 14], [14, 0]]) { const y = r - fr, x = c - fc; if (y >= 0 && y < 7 && x >= 0 && x < 7) return (y === 0 || y === 6 || x === 0 || x === 6 || (y > 1 && y < 5 && x > 1 && x < 5)) ? 1 : 0; } return -1; };
  for (let r = 0; r < 21; r++) for (let c = 0; c < 21; c++) { const f = finder(r, c); s = (s * 9301 + 49297) % 233280; const on = f === -1 ? s / 233280 > 0.5 : f === 1; cells += `<i style="background:${on ? "#0b3a6e" : "#fff"}"></i>`; }
  return cells;
}

function qr() {
  return `<div class="sec" style="text-align:center"><img src="${LOGO}" style="height:46px" alt="Salty Spirit"><h3 style="margin-top:10px">${T("qrTitle")}</h3>
    <div class="qr">${qrGrid()}</div><div class="muted">${T("qrSub")}</div></div>
    <div class="sec">${["qr1", "qr2", "qr3"].map((k, i) => `<div class="card row" style="justify-content:flex-start;gap:10px"><b style="color:var(--blue)">${i + 1}</b><span style="font-size:13px">${T(k)}</span></div>`).join("")}
    <div class="card" style="background:var(--sea);border-color:#c8dcf0"><b>${T("alerts")}</b><div class="muted" style="margin-top:4px">${T("alertsD")}</div></div></div>`;
}

function sheet() {
  const bar = `<div class="steps">${[0, 1, 2].map(i => `<div class="${i <= step ? "on" : ""}"></div>`).join("")}</div>`;
  if (step === 0) return `<b>${T("s1")}</b>${bar}<div class="drop">📷<br>${T("s1d")}</div><button class="btn blue full" id="nx" style="margin-top:12px">${T("next")}</button>`;
  if (step === 1) return `<b>${T("s2")}</b>${bar}<div class="card"><div class="row"><span class="muted">${lang === "es" ? "Especie" : "Species"}</span><b>${lang === "es" ? "Dorado" : "Mahi-mahi"}</b></div><div class="row" style="margin-top:8px"><span class="muted">${T("weight")}</span><b>14.2 lb</b></div><div class="row" style="margin-top:8px"><span class="muted">GPS</span><b class="ok">✓ Vieques · ${lang === "es" ? "hoy" : "today"}</b></div></div><button class="btn blue full" id="nx">${T("next")}</button>`;
  return `<b>${T("s3")}</b>${bar}<div class="card" style="text-align:center"><div style="font-size:34px">✅</div><div style="font-size:13px">${T("s3d")}</div></div><button class="btn full" id="nx">${T("done")}</button>`;
}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1600); }

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("bES").classList.toggle("on", lang === "es"); $("bEN").classList.toggle("on", lang === "en");
  $("screen").innerHTML = { partner, tourney, card, qr }[tab]();
  $("screen").querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { cat = b.dataset.cat; render(); });
  const en = $("enter"); if (en) en.onclick = () => { step = 0; openSheet(); };
  const sh = $("share"); if (sh) sh.onclick = () => toast(T("toastShare"));
}
function openSheet() {
  $("modal").classList.add("on"); $("sheet").innerHTML = sheet();
  $("nx").onclick = () => { if (step < 2) { step++; openSheet(); } else { $("modal").classList.remove("on"); tab = "card"; render(); } };
}
$("modal").onclick = e => { if (e.target.id === "modal") $("modal").classList.remove("on"); };
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; $("screen").scrollTop = 0; render(); });
$("bES").onclick = () => { lang = "es"; render(); };
$("bEN").onclick = () => { lang = "en"; render(); };
render();
</script>
</body>
</html>
